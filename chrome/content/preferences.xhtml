<vbox
    xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    xmlns:html="http://www.w3.org/1999/xhtml"
    onload="Zotero.ZoteroUtils.initPrefsPane(this)"
>
  <groupbox>
    <label><html:h2>AI Provider</html:h2></label>

    <hbox align="center" style="margin-bottom: 10px">
      <label value="Provider:" control="zu-provider-list" style="min-width: 120px" />
      <menulist id="zu-provider-list" style="min-width: 220px">
        <menupopup id="zu-provider-popup" />
      </menulist>
      <button id="zu-provider-add" label="Add provider…" />
      <button id="zu-provider-remove" label="Remove" />
    </hbox>

    <hbox align="center" style="margin-bottom: 10px">
      <label value="Endpoint:" control="zu-provider-endpoint" style="min-width: 120px" />
      <html:input
                id="zu-provider-endpoint"
                type="text"
                placeholder="https://…/v1"
                style="flex: 1"
            />
    </hbox>

    <hbox align="center" style="margin-bottom: 10px">
      <label value="Model name:" control="zu-provider-model" style="min-width: 120px" />
      <html:input
                id="zu-provider-model"
                type="text"
                style="flex: 1"
            />
    </hbox>

    <hbox align="center" style="margin-bottom: 10px">
      <label value="API key:" control="zu-provider-apikey" style="min-width: 120px" />
      <html:input
                id="zu-provider-apikey"
                type="password"
                placeholder="API key, or password for a local server"
                style="flex: 1"
            />
    </hbox>

    <hbox align="center" style="margin-bottom: 10px">
      <label value="Language:" control="ai-language" style="min-width: 120px" />
      <menulist id="ai-language" preference="extensions.zotero-utils.language">
        <menupopup>
          <menuitem label="Dutch (Nederlands)" value="nl" />
          <menuitem label="English" value="en" />
        </menupopup>
      </menulist>
    </hbox>

    <description style="margin-top: 10px">
      The selected provider is used for summaries and translations. Every provider needs an
      OpenAI-compatible endpoint (offering /chat/completions), a model name and an API key, which is
      sent as a Bearer token. A local server (127.0.0.1 / localhost) may be used without a key.
      Changes are saved immediately.
    </description>
    <description style="margin-top: 6px">
      API keys: Gemini at https://aistudio.google.com/ and Mistral at https://console.mistral.ai/.
    </description>
  </groupbox>

  <groupbox>
    <label><html:h2>Summary Settings</html:h2></label>

    <hbox align="center" style="margin-bottom: 10px">
      <label value="Extraction Mode:" control="extraction-mode" style="min-width: 120px" />
      <menulist id="extraction-mode" preference="extensions.zotero-utils.extractionMode">
        <menupopup>
          <menuitem label="Text Only (Faster)" value="text" />
          <menuitem label="Full Text Extraction (Thorough)" value="pdf" />
          <menuitem label="Send Native PDF (Multimodal)" value="native" />
        </menupopup>
      </menulist>
    </hbox>

    <description style="margin-top: 10px">
      <html:strong>Extraction Mode:</html:strong> "Text Only" uses Zotero's built-in text extraction from the current view.
      "Full Text Extraction" extracts all text from the PDF file. "Send Native PDF" sends the actual PDF file directly to Gemini's native API for multimodal analysis; other providers receive the extracted text instead.
    </description>
  </groupbox>

  <groupbox>
    <label><html:h2>Export Settings</html:h2></label>

    <hbox align="center" style="margin-bottom: 10px">
      <label value="Export Path:" control="export-path" style="min-width: 120px" />
      <html:input
        id="export-path"
        type="text"
        preference="extensions.zotero-utils.exportPath"
        placeholder="Leave empty to use home directory"
        style="flex: 1"
      />
    </hbox>

    <description>
      Markdown files will be saved to this directory. Leave empty to save to your home directory.
    </description>
  </groupbox>

  <groupbox>
    <label><html:h2>Auto-tagging Settings</html:h2></label>

    <hbox align="center" style="margin-bottom: 10px">
      <label value="Enable Auto-tagging:" control="auto-tag-enabled" style="min-width: 120px" />
      <checkbox id="auto-tag-enabled" preference="extensions.zotero-utils.autoTagEnabled" />
    </hbox>

    <hbox align="center" style="margin-bottom: 10px">
      <label value="Unread Tag:" control="unread-tag" style="min-width: 120px" />
      <html:input
        id="unread-tag"
        type="text"
        preference="extensions.zotero-utils.unreadTag"
        placeholder="/unread"
        style="flex: 1"
      />
    </hbox>

    <description style="margin-top: 10px">
      When enabled, new items will automatically receive the specified tag (default: /unread).
    </description>
  </groupbox>

  <groupbox>
    <label><html:h2>Annotation Colors</html:h2></label>

    <description style="margin-bottom: 10px">
      Custom labels for the annotation highlight colors, shown in the color menus of the PDF reader.
      Leave a field empty to keep Zotero's own color name.
    </description>

    <hbox align="center" style="margin-bottom: 6px">
      <html:span style="display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-inline-end: 8px; background-color: #ffd400"></html:span>
      <label value="Yellow:" control="zu-color-ffd400" style="min-width: 100px" />
      <html:input
        id="zu-color-ffd400"
        type="text"
        preference="extensions.zotero-utils.colorLabel.ffd400"
        placeholder="Zotero default name"
        style="flex: 1"
      />
    </hbox>

    <hbox align="center" style="margin-bottom: 6px">
      <html:span style="display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-inline-end: 8px; background-color: #ff6666"></html:span>
      <label value="Red:" control="zu-color-ff6666" style="min-width: 100px" />
      <html:input
        id="zu-color-ff6666"
        type="text"
        preference="extensions.zotero-utils.colorLabel.ff6666"
        placeholder="Zotero default name"
        style="flex: 1"
      />
    </hbox>

    <hbox align="center" style="margin-bottom: 6px">
      <html:span style="display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-inline-end: 8px; background-color: #5fb236"></html:span>
      <label value="Green:" control="zu-color-5fb236" style="min-width: 100px" />
      <html:input
        id="zu-color-5fb236"
        type="text"
        preference="extensions.zotero-utils.colorLabel.5fb236"
        placeholder="Zotero default name"
        style="flex: 1"
      />
    </hbox>

    <hbox align="center" style="margin-bottom: 6px">
      <html:span style="display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-inline-end: 8px; background-color: #2ea8e5"></html:span>
      <label value="Blue:" control="zu-color-2ea8e5" style="min-width: 100px" />
      <html:input
        id="zu-color-2ea8e5"
        type="text"
        preference="extensions.zotero-utils.colorLabel.2ea8e5"
        placeholder="Zotero default name"
        style="flex: 1"
      />
    </hbox>

    <hbox align="center" style="margin-bottom: 6px">
      <html:span style="display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-inline-end: 8px; background-color: #a28ae5"></html:span>
      <label value="Purple:" control="zu-color-a28ae5" style="min-width: 100px" />
      <html:input
        id="zu-color-a28ae5"
        type="text"
        preference="extensions.zotero-utils.colorLabel.a28ae5"
        placeholder="Zotero default name"
        style="flex: 1"
      />
    </hbox>

    <hbox align="center" style="margin-bottom: 6px">
      <html:span style="display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-inline-end: 8px; background-color: #e56eee"></html:span>
      <label value="Magenta:" control="zu-color-e56eee" style="min-width: 100px" />
      <html:input
        id="zu-color-e56eee"
        type="text"
        preference="extensions.zotero-utils.colorLabel.e56eee"
        placeholder="Zotero default name"
        style="flex: 1"
      />
    </hbox>

    <hbox align="center" style="margin-bottom: 6px">
      <html:span style="display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-inline-end: 8px; background-color: #f19837"></html:span>
      <label value="Orange:" control="zu-color-f19837" style="min-width: 100px" />
      <html:input
        id="zu-color-f19837"
        type="text"
        preference="extensions.zotero-utils.colorLabel.f19837"
        placeholder="Zotero default name"
        style="flex: 1"
      />
    </hbox>

    <hbox align="center" style="margin-bottom: 6px">
      <html:span style="display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-inline-end: 8px; background-color: #aaaaaa"></html:span>
      <label value="Gray:" control="zu-color-aaaaaa" style="min-width: 100px" />
      <html:input
        id="zu-color-aaaaaa"
        type="text"
        preference="extensions.zotero-utils.colorLabel.aaaaaa"
        placeholder="Zotero default name"
        style="flex: 1"
      />
    </hbox>
  </groupbox>
</vbox>
